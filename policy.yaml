# policy.yaml -- externalized thresholds, identities, and tool paths for this
# bench's scoring tools ("externalize policy as data" design principle).
# Every path, threshold, and tunable the tools read lives here, never
# hardcoded in Python. There are deliberately no scoring weights: the
# leaderboard ranks on mean first-attempt correctness, adds mean first-attempt
# test kill rate as a second, independent ranking, and blends nothing.

# Reviewer/drift-audit seats are varied by design -- PM commissions
# whichever tool/model it chooses per `review` call (pm_lib.review's
# --tool/--model), often a panel of several models per slice, each
# bringing a different strength. There is deliberately no policy key here
# for it: nothing pins reviewer composition in advance, and each review
# event already carries its own tool/model in run.json (harvested
# per-review by review_score.py's tool=/model= fields), so a varying panel
# needs no policy support -- it is already representable per-review, not
# per-run.

# There is deliberately no one-shot pre-filter key: a candidate is only ever
# run through PM because the operator already cares about it, so the
# leaderboard is PM-run data only.

# PM run repeats per Developer model, for variance testing. `default`
# applies to every model; add a same-named key under this mapping to
# override it for one model. No fixed ceiling -- a model can be run 5+
# times.
repeats:
  default: 1

# State/command access backend for the grading tools. "local" = direct
# filesystem + subprocess, the only backend implemented today. "sbx" is
# reserved for a future ai-agent-sbx adapter (sbx exec / sbx cp) --
# selecting it before it exists must fail loudly, never silently fall back
# to "local".
backend: local

# Path to project-manager's scripts/ directory (absolute or ~-relative), added to sys.path
# so pm_lib is importable read-only (never invoked as a subprocess, never
# given a run token -- dev_check.py only reads pm_lib.plan/pm_lib.git_ops
# helpers).
pm_scripts_dir: ~/Documents/AI/skills/project-manager/scripts

# Path to the lint skill's script (absolute, or ~-relative to the operator's
# home). Invoked as:
#   <python_interpreter> <lint_script> --repo <worktree> check --json --base <before_head>
lint_script: ~/Documents/AI/repos/ai-agent-coder/skills/lint/scripts/lint.py

# Path to the code-health skill's script (absolute or ~-relative). Invoked as:
#   <python_interpreter> <health_script> analyze --json --base <before_head>
# with the process cwd set to the grading worktree -- health.py has no
# --repo flag; it always analyzes its own working directory.
health_script: ~/Documents/AI/repos/ai-agent-coder/skills/code-health/scripts/health.py

# Python interpreter used for every subprocess this tool runs (pytest against
# the hidden tests, lint.py, health.py) inside the disposable grading
# worktree. Point this at an interpreter with the Developer repo's own
# dependencies installed (numpy/scipy/h5py/etc for relative-velocity) --
# this repo's own requirements.txt deliberately does not include them.
python_interpreter: ~/.conda/envs/work/bin/python3

# Per-subprocess wall-clock timeout, in seconds, for pytest/lint/health, and
# reused (no separate key -- DRY) by cohort_run.py setup's best-effort venv
# pre-build (running the Developer repo's own setup.sh once, up front).
subprocess_timeout_seconds: 600

# Directory under which disposable grading worktrees are created (passed as
# tempfile.mkdtemp's `dir=`; null uses the platform default temp root). Must
# never resolve inside the Developer's repo being graded -- dev_check.py
# asserts this and fails loudly if violated.
grading_worktree_root: null

# The mutation gate behind dev_check.py's test_kill_rate measurement: each
# listed mutant re-runs the candidate's OWN baseline-passing tests once (by
# node id, stopping at the first failure) in a disposable worktree, with the
# task's mutations_dir prepended to PYTHONPATH and MUTATION=<id> set. Each
# run's wall-clock limit is subprocess_timeout_seconds above (no separate key
# -- DRY); a timed-out mutant is recorded as errored, never as killed.
mutation_gate:
  # How many mutant runs execute concurrently in the gate's own grading
  # worktree. 1 (strictly serial) is the deterministic default: only then is
  # a failing baseline-passing test attributable to the mutant alone. A
  # higher value trades that determinism for speed -- concurrent runs of a
  # suite that is not safe to run in parallel in one directory (fixed
  # scratch paths, shared output files) can interfere and record a spurious
  # kill -- and is the operator's call.
  parallel_workers: 1

# Operator attestations for runs whose PM state never recorded the Developer
# identity, keyed by run id. Used only to fill a field neither run.json's own
# `harness` block nor PM's `developer_judgments[].developer` snapshots
# recorded -- a structurally recorded value always wins, and a conflict
# between an attestation and a recorded value is a named error, never a
# silent override. Each entry states its reason and the evidence behind it;
# the applied correction is snapshotted into report provenance (bench_lib
# .resolve_developer_identity's returned `attestation` field) so a later
# policy edit cannot rewrite how an earlier generation was attributed.
identity:
  corrections:
    20260912T105700Z-c207d3:
      harness: opencode
      model: github-copilot/mai-code-1.1-flash
      effort: null
      reason: >-
        PM recorded harness.model=null (opencode, no command_override) and this
        run predates project-manager's developer_judgments, so no structured
        launch record survives.
      evidence: >-
        Operator's explicit identification, corroborated by this run's own
        model-performance.md and notes.md, both of which name MAI Flash.
        Prose is corroboration only -- it is never parsed as an identity source.
    # Same pre-fix null-vs-default gap as above, on the mimo_v2_5 entries
    # below: deepseek-v4-flash-q8 has no opencode effort variants, so these
    # two pre-fix runs recorded effort=null for the same plain launch that
    # post-fix run 20260918T111243Z-5b4a4d records as "default".
    20260917T093617Z-ebdfb9: &deepseek_v4_flash_q8_default_effort
      effort: default
      reason: >-
        Predates pm_lib's null-vs-default provenance fix (2026-09-18);
        deepseek-v4-flash-q8 has no opencode effort variants, so pre-fix
        pm_lib recorded null instead of "default" for this plain launch.
      evidence: >-
        Same model/tool, no command_override, as post-fix run
        20260918T111243Z-5b4a4d, which resolves effort="default" for an
        identical launch. Prose is corroboration only.
    20260917T232009Z-c1a3a7: *deepseek_v4_flash_q8_default_effort

# Operator attestations for reviewer commissions whose PM state never
# recorded model/effort, keyed by run id then by event_index (review_score
# .py's own per-commission primary key -- see its module docstring; unique
# per commission across a run's whole event log, not just within one
# slice). Used only to fill a field `run.json`'s own `reviews[]` entry
# recorded null -- a structurally recorded non-null value always wins, and
# a conflict between a correction and a recorded value is a named error,
# never a silent override (review_score.resolve_review_identity). Each
# entry states its reason and the evidence behind it; the applied
# correction is snapshotted onto the harvested record's own
# `identity_correction` field so a later policy edit cannot rewrite how an
# earlier generation was attributed.
#
# All nine entries below share one root cause: opencode-go/mimo-v2.5
# declares no opencode effort variants at all, so commissioning it under
# these runs' inherited run-level --reviewer-effort required
# --reviewer-command (pm_lib's pre-fix behaviour, corrected 2026-09-18 --
# see project-manager's own CHANGELOG), which unconditionally recorded this
# commission's model/effort as null in run.json.
review_identity:
  corrections:
    20260918T054505Z-b51095:
      9: &mimo_v2_5_default_effort
        model: opencode-go/mimo-v2.5
        effort: default
        reason: >-
          --reviewer-command was required because opencode-go/mimo-v2.5 declares
          no effort variants; pre-fix pm_lib unconditionally recorded this
          commission's model/effort as null under that override.
        evidence: >-
          This commission's own stderr transcript captures opencode's startup
          banner ("> plan · mimo-v2.5"); this run's own model-performance.md
          names the model explicitly and states it ran at its own default
          effort. Prose is corroboration only -- it is never parsed as an
          identity source.
      24: *mimo_v2_5_default_effort
      41: *mimo_v2_5_default_effort
    20260918T054735Z-4a78e6:
      8: *mimo_v2_5_default_effort
      26: *mimo_v2_5_default_effort
      41: *mimo_v2_5_default_effort
      56: *mimo_v2_5_default_effort
    20260918T054949Z-8c34c0:
      9: *mimo_v2_5_default_effort
      25: *mimo_v2_5_default_effort

# Methodology for production size and complexity (ΔLOC/ΔCC per attempt),
# applied uniformly to every task. Each task's own path globs live under
# tasks:<id>:measurement instead, because they describe that task's repo
# layout rather than a methodology choice. The globs classify *repo-relative*
# paths from `git diff --numstat`/health.py's own `path` fields in Python
# (dev_check.classify_path), never via a git pathspec -- pathspec `**`
# semantics need `:(glob)` magic and are a silent-surprise risk. A path
# matching none of a task's production_paths/test_paths/doc_paths lands in
# its own "unclassified" bucket rather than being silently dropped or folded
# into production. Buckets are checked in a fixed order (production, then
# test, then doc), which matters if a task's globs ever overlap.
measurement:
  # The only ΔLOC definition dev_check.py implements: `git diff --numstat`'s
  # own added-minus-deleted count, i.e. physical lines including comments
  # and blanks. This is labelled explicitly because it is NOT the same
  # number as SLOC-excluding-comments (a reasonable later alternative under
  # one pinned analyzer run on both revisions) -- the two are never mixed,
  # and a policy value naming any other definition must fail loudly in
  # dev_check.load_policy rather than being silently treated as this one.
  loc_definition: net_physical_lines   # git --numstat added - deleted

  # The only production-only code/docstring/comment/blank decomposition
  # dev_check.py implements. Physical ΔLOC alone conflates "wrote more
  # code" with "wrote more docstrings", so this separates them: parse each
  # production .py file at both revisions with `ast` to find docstring
  # line ranges -- an AST docstring
  # specifically, i.e. a bare string-constant expression that is the FIRST
  # statement of a Module/ClassDef/FunctionDef/AsyncFunctionDef body; a
  # string constant anywhere else in a body counts as ordinary code, not a
  # docstring -- then tokenize with `tokenize` to classify every remaining
  # physical line as code/comment/blank. See dev_check.classify_source_lines
  # for the exact precedence (code wins over docstring wins over comment).
  # An unimplemented alternative must fail loudly here, never be silently
  # treated as this one.
  loc_category_definition: ast_tokenize_line_classification

  # Bumped whenever this measurement's own definition changes (a glob
  # edited, the LOC definition changed, a new complexity source added, or
  # the production code/docstring/comment/blank decomposition changed) --
  # stamped onto every attempt's size_complexity block and surfaced in
  # generated reports/leaderboards so a metric-version rebuild of
  # already-graded runs is distinguishable from a genuinely new trial, never
  # silently conflated with one.
  metric_version: 2

# The hygiene census behind dev_check.py's per-attempt `hygiene` block:
# deterministic counts over one attempt's diff against its slice's own
# before_head, descriptive only and never scored (like ΔLOC above). Added
# production lines are classified with the same code/docstring/comment/blank
# precedence as measurement.loc_category_definition, so the two can never
# disagree about what a line is. Every pattern below is a Python regex,
# matched case-insensitively with re.search; load_policy refuses one that
# does not compile, naming it.
hygiene:
  # Matched against each ADDED comment or docstring line of a production
  # file: history narration (who steered what, which round or slice of the
  # plan a line came from) that belongs in a commit message or plan, never in
  # the code itself. A line matching several patterns counts once in
  # narration_lines and once under each pattern it matched.
  narration_tokens:
    - '\bsteer(?:ed|ing|s)?\b'
    - '\bround \d+\b'
    - '\bslice \d+\b'
    - '\btoday\b'
    - '\blegacy\b'
    - '\bTODO\b'
  # A commit subject longer than this many characters is counted, never
  # rejected.
  commit_subject_max_length: 72
  # Matched against each commit subject in before_head..commit: supervision
  # process leaking into the branch history rather than a description of
  # the change.
  commit_process_labels:
    - '\bsteer\b'
    - '\battempt[- ]?\d+\b'
    - '\bround \d+\b'

# The optional quality panel (tools/quality_panel.py): one read-only reviewer
# configuration, commissioned post-hoc through the orchestrator skill's
# delegate_jobs.py launcher, reads a graded slice attempt's commit against the
# frozen plan and returns five 1-5 scores with path:line evidence. It is a
# model's judgement, not a measurement: the scores are subjective and not
# repeatable the way a test is, so they are surfaced in their own labelled
# table and never blended into correctness, kill rate or any rank. The
# configuration is fixed per cohort in intent; it may still be swapped (a
# model becomes unavailable), and every rating records its own tool, model,
# effort, rubric sha256 and rendered-prompt sha256, so a swap is visible on
# the record rather than hidden. Repeat commissions append, never overwrite,
# which is what makes the panel's repeatability visible.
quality_panel:
  tool: claude                       # orchestrator harness name (claude|codex|copilot|opencode|qwen)
  model: claude-opus-5-5
  effort: high
  rubric_file: docs/QUALITY-PANEL-RUBRIC.md   # relative to this bench's root; its sha256 is recorded on every rating
  orchestrator_scripts_dir: ~/Documents/AI/repos/ai-agent-coder/skills/orchestrator/scripts
  artifact_root: .orchestrator/quality-panel  # relative to this bench's root; delegate runs land here (gitignored)
  timeout_seconds: 3600              # one `delegate_jobs.py wait --timeout`; a timed-out delegate is cancelled

# Task registry: which scientific tasks this bench can run side by side,
# keyed by operator-chosen task id, plus `default_task` -- the entry every
# tool applies when no --task flag is given. This registry and `default_task`
# are the sole source of task configuration, resolved once at the boundary by
# bench_lib.resolve_task. Adding a task means adding an entry here plus its
# own plan, provenance and hidden-tests files; no code changes.
#
# Per-entry keys:
#   repo, branch_prefix, worktree_root -- the target repo and where its trial
#     worktrees live (see the repo key below; worktree_root null puts them
#     beside the repo).
#   plan_file -- the frozen plan's path RELATIVE TO THE TARGET REPO.
#   provenance_file, hidden_tests_dir, obligations_file, mutations_dir --
#     paths RELATIVE TO THIS BENCH'S OWN ROOT. mutations_dir holds the task's
#     mutation bank for dev_check.py's test_kill_rate measurement: the
#     sitecustomize.py hook module (all_mutation_ids() is its registry) plus
#     one slice<N>.txt per plan slice listing the mutant ids that slice owns
#     (one per line, `#` comments and blank lines ignored). A mutant is
#     measured only when its own slice is graded.
#   expected_slices -- how many slices the task's frozen plan has.
#   measurement -- the target repo's layout globs (production_paths,
#     test_paths, doc_paths); see the global measurement block above for why
#     the methodology keys are not per task.
default_task: relative-velocity

tasks:
  relative-velocity:
    # The substrate repo cohort_run.py's `setup` creates trial worktrees of.
    # Vendored locally under substrate/ (gitignored) rather than pointed at
    # the operator's own working checkout elsewhere, so this bench is
    # self-contained and immune to that checkout moving, being on the wrong
    # branch, or having uncommitted changes. `setup` never touches this
    # checkout itself: it runs `git worktree add` against it to create one
    # disposable worktree per trial, branched from this task's one pinned
    # plan commit (parsed live from provenance_file, never duplicated as a
    # second, driftable source of truth here).
    #
    # A relative path here resolves against this bench's own repo root, never
    # the caller's cwd. If substrate/relative-velocity is ever missing (a
    # fresh clone of this bench), repopulate it once with:
    #   git clone git@github.com:darrencroton/relative-velocity.git substrate/relative-velocity
    repo: substrate/relative-velocity
    # Trial branches are named <branch_prefix>/<label>.
    branch_prefix: pm-eval-v2
    worktree_root: null
    plan_file: docs/MERGER_RATE_PLAN-2SLICE.md
    provenance_file: docs/MERGER_RATE_PLAN-2SLICE.provenance.md
    hidden_tests_dir: hidden_tests
    obligations_file: hidden_tests/obligations.yaml
    # The one-shot predecessor's 73-mutant Task 001 bank, vendored
    # AST-identical after one `ruff format` pass, with this bench's own
    # per-slice lists (provenance: docs/reference-impl/README.md).
    mutations_dir: hidden_tests/mutations
    expected_slices: 2
    measurement:
      production_paths: ["src/**/*.py"]
      test_paths: ["tests/**/*.py"]
      doc_paths: ["docs/**/*.md", "*.md"]

  # The second task (docs/SECOND-TASK-PROPOSAL.md): the Developer implements
  # multi-task support for this bench's own tools, inside a dedicated clone of
  # THIS repository, pinned at the pre-implementation commit plus the commits
  # that add only the two re-cut plans and the clone's setup.sh. Both plans
  # live in that history, so the two entries below share a pin (parsed live
  # from each provenance_file, as for relative-velocity). They are separate
  # task ids, not one task with two plans, because a task's plan_hash is part
  # of its rubric provenance. The two entries must keep distinct branch
  # prefixes: `analyze-all` discovers a run by its owning task's prefix, and a
  # run two tasks could claim is named as ambiguous and skipped (gradeable
  # only by hand with an explicit --task). `analyze --dev-repo` cannot infer
  # either task (the worktree belongs to both tasks' repo), so pass --task
  # explicitly; dev_check.py's plan-identity check then refuses a trial graded
  # under the other cut's rubric. Both cuts share one hidden-test directory
  # and one mutation bank; only the obligations maps differ.
  #
  # The clone is deliberately single-branch with its remote removed: this
  # repository's own main carries a finished implementation of these plans,
  # and a trial worktree shares the clone's object store, so no other ref may
  # be reachable from it. (Trial worktrees live under this checkout's own
  # substrate/, two levels below tools/, exactly as relative-velocity's do;
  # the operator's machine holds the answer regardless, and the bench accepts
  # that.) If substrate/ai-agent-bench-task is ever missing, repopulate it
  # with exactly:
  #   git clone --single-branch --no-tags -b bench-multitask-substrate git@github.com:darrencroton/ai-agent-bench.git substrate/ai-agent-bench-task
  #   git -C substrate/ai-agent-bench-task remote remove origin
  bench-multitask-3slice:
    repo: substrate/ai-agent-bench-task
    branch_prefix: pm-eval-mt3
    worktree_root: null
    plan_file: docs/plans/MULTI-TASK-PLAN-3SLICE.md
    provenance_file: docs/plans/MULTI-TASK-PLAN-3SLICE.provenance.md
    hidden_tests_dir: hidden_tests/bench-multitask
    obligations_file: hidden_tests/bench-multitask/obligations-3slice.yaml
    mutations_dir: hidden_tests/bench-multitask/mutations
    expected_slices: 3
    measurement:
      production_paths: ["tools/**/*.py"]
      test_paths: ["tests/**/*.py"]
      doc_paths: ["docs/**/*.md", "*.md"]

  bench-multitask-2slice:
    repo: substrate/ai-agent-bench-task
    branch_prefix: pm-eval-mt2
    worktree_root: null
    plan_file: docs/plans/MULTI-TASK-PLAN-2SLICE.md
    provenance_file: docs/plans/MULTI-TASK-PLAN-2SLICE.provenance.md
    # Shares the 3-slice task's hidden-test directory (its Slices 1-2 are the
    # same contract); only the obligations map, whose `plan:` must name this
    # task's own plan_file, is separate.
    hidden_tests_dir: hidden_tests/bench-multitask
    obligations_file: hidden_tests/bench-multitask/obligations-2slice.yaml
    # Shares the 3-slice task's bank for the same reason; only slice1.txt and
    # slice2.txt are ever read for this task.
    mutations_dir: hidden_tests/bench-multitask/mutations
    expected_slices: 2
    measurement:
      production_paths: ["tools/**/*.py"]
      test_paths: ["tests/**/*.py"]
      doc_paths: ["docs/**/*.md", "*.md"]
