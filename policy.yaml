# policy.yaml -- externalized weights, thresholds, and tool paths for the
# pm-eval-v2 scoring tools (docs/MODE2-REWRITE-PLAN.md's "externalize
# policy as data" design principle). Every path, threshold, and tunable
# Tool 1 reads lives here, never hardcoded in tools/dev_check.py. Tool 5
# (tools/leaderboard.py) owns scoring weights -- see the `leaderboard`
# section below -- none are hardcoded in Python.

# Reviewer/drift-audit seats are varied by design -- PM commissions
# whichever tool/model it chooses per `review` call (pm_lib.review's
# --tool/--model), often a panel of several models per slice, each
# bringing a different strength. There is deliberately no policy key here
# for it: nothing pins reviewer composition in advance, and each review
# event already carries its own tool/model in run.json (harvested
# per-review by review_score.py's tool=/model= fields), so a varying panel
# needs no policy support -- it is already representable per-review, not
# per-run.

# The one-shot pre-filter screen was considered and dropped (operator
# decision): a candidate is only ever run through PM because the operator
# already cares about it, and the screen never changed that decision.
# There is deliberately no prefilter key here; Tool 5's leaderboard is
# PM-run data only.

# The substrate repo cohort_run.py's `setup` creates trial worktrees of --
# relative-velocity, wherever the operator keeps their own checkout of it.
# `setup` never touches this checkout itself: it runs `git worktree add`
# against it to create one disposable worktree per trial, branched from
# this bench's one pinned plan commit (parsed live from
# docs/MERGER_RATE_PLAN-2SLICE.provenance.md, never duplicated as a second,
# driftable source of truth here).
relative_velocity_repo: /Users/dcroton/Local/git-repos/relative-velocity

# Branch prefix for cohort_run.py setup's trial worktrees/branches --
# <dev_branch_prefix>/<label>. Defaults to this branch's own name, so a
# trial branch reads as "this bench's own", replacing the ad hoc
# "mode2-dryrun" prefix used by a couple of pre-Tool-6 dry runs.
dev_branch_prefix: pm-eval-v2

# Directory under which cohort_run.py setup creates trial worktrees. null
# (default) creates them as siblings of relative_velocity_repo
# (relative_velocity_repo's own parent directory / "<repo-name>-<label>"),
# matching this bench's existing on-disk convention.
dev_worktree_root: null

# PM run repeats per Developer model, for variance testing. `default`
# applies to every model; add a same-named key under this mapping to
# override it for one model. No fixed ceiling -- a model can be run 5+
# times.
repeats:
  default: 1

# State/command access backend for the grading tools. "local" = direct
# filesystem + subprocess, the only backend implemented today. "sbx" is
# reserved for a future ai-agent-sbx adapter (sbx exec / sbx cp) --
# selecting it before it exists must fail loudly, never silently fall back
# to "local".
backend: local

# Absolute path to project-manager's scripts/ directory, added to sys.path
# so pm_lib is importable read-only (never invoked as a subprocess, never
# given a run token -- dev_check.py only reads pm_lib.plan/pm_lib.git_ops
# helpers).
pm_scripts_dir: /Users/dcroton/Documents/AI/skills/project-manager/scripts

# Absolute path to the ai-agent-coder lint skill's script. Invoked as:
#   <python_interpreter> <lint_script> --repo <worktree> check --json --base <before_head>
lint_script: /Users/dcroton/Documents/AI/repos/ai-agent-coder/skills/lint/scripts/lint.py

# Absolute path to the ai-agent-coder code-health skill's script. Invoked as:
#   <python_interpreter> <health_script> analyze --json --base <before_head>
# with the process cwd set to the grading worktree -- health.py has no
# --repo flag; it always analyzes its own working directory.
health_script: /Users/dcroton/Documents/AI/repos/ai-agent-coder/skills/code-health/scripts/health.py

# Python interpreter used for every subprocess this tool runs (pytest against
# the hidden tests, lint.py, health.py) inside the disposable grading
# worktree. Point this at an interpreter with the Developer repo's own
# dependencies installed (numpy/scipy/h5py/etc for relative-velocity) --
# this repo's own requirements.txt deliberately does not include them.
python_interpreter: /Users/dcroton/.conda/envs/work/bin/python3

# Per-subprocess wall-clock timeout, in seconds, for pytest/lint/health.
subprocess_timeout_seconds: 600

# Directory under which disposable grading worktrees are created (passed as
# tempfile.mkdtemp's `dir=`; null uses the platform default temp root). Must
# never resolve inside the Developer's repo being graded -- dev_check.py
# asserts this and fails loudly if violated.
grading_worktree_root: null

# Tool 5's (leaderboard.py) cross-model composite. Every weight and
# threshold it uses lives here -- leaderboard.py hardcodes no fallback
# default, so a missing key here is a named error, never a silent guess.
leaderboard:
  # How the four deterministic sub-scores blend into one composite_score.
  # Must sum to 1.0 (leaderboard.py fails loudly, naming the actual sum,
  # if they don't). Correctness dominates because it is the most direct
  # measure of whether the Developer seat produced right code; quality and
  # scope matter but are secondary; iterations matters least on its own
  # (a slow-but-correct model is still useful; a fast-but-wrong one is not).
  weights:
    correctness: 0.5
    quality: 0.25
    scope: 0.15
    iterations: 0.10
  # Per-violation penalty subtracted from a slice-record's scope score
  # (1.0 - violations * this, floored at 0.0). 0.2 means five or more
  # violations in one final attempt zeroes that slice-record's scope score
  # entirely -- scope discipline is a hard-ish requirement, not a minor
  # deduction.
  scope_violation_penalty: 0.2
  # The attempt count treated as "no penalty" for the iterations sub-score
  # (iteration_reference_attempts / max(attempts_total, this), capped at
  # 1.0). 3 matches this bench's own plan: a well-behaved Developer model
  # is expected to need at most a couple of steers per slice before
  # acceptance.
  iteration_reference_attempts: 3
