# Profile-view policy for ai-agent-bench.
#
# Deliberately NOT part of eval/rubric.yaml. grade_trial.py hashes
# rubric.yaml's bytes into every graded record's `provenance.rubric_sha256`,
# and aggregate.py's `cohort_key()` partitions on that hash -- a single byte
# changed there forks every future cohort away from the 219 existing records
# (see AGENTS.md's "Hard invariants"). The profile view (structure.py,
# profile_view.py, branch_check.py) reads the EXISTING 219 records and never
# re-grades, so its policy has to live somewhere grade_trial.py never reads.
# This is the same reasoning that put eval/leaderboard_summaries.yaml outside
# eval/tasks/<id>/meta.yaml -- see that file's own header comment for the
# 2026-09-07 incident where a cosmetic meta.yaml edit silently forked a
# cohort.
#
# Versioned the same way rubric.yaml is: bump `version` and record the
# reasoning in docs/DESIGN.md's History if any value here ever changes. A
# structural_score computed under one version is not comparable to one
# computed under another -- eval/results/structure.json's `_meta.policy_sha256`
# (see structure.py's `policy_sha256()`) exists so a consumer can tell which
# formula produced a given number without re-deriving it.
#
# What's actually hashed: `version` and the `structure:` block are hashed
# into `_meta.policy_sha256`. There used to be `score:`/`flags:` blocks here
# too, but they were declarative documentation read by no code -- profile_view.py
# hardcodes the actual column semantics (test_adequacy is the score, hygiene
# and scope_discipline are flags) -- and were removed on 2026-09-08 rather
# than kept as decorative configuration. See docs/DESIGN.md's History and
# README.md/this file's own comments for the current column semantics.

version: 2

# ---- correctness gate ----
#
# gate_pass = category_scores.correctness >= threshold, read from the
# EXISTING graded records (eval/results/runs/*.json) -- no re-grading.
# A record whose correctness is None (gate-failed or no-submission at grade
# time) is a gate FAIL, never a skip -- see docs/EVAL-CONSOLIDATION-TRIAL.md's
# "The correctness gate".
#
# 0.70 is not fitted to this cohort; it was picked because the observed
# distribution of `category_scores.correctness` over all 219 records is one
# 0.0 (a genuine no-submission/gate-failed trial) and then NOTHING again
# until 0.834. The threshold sits in that empty band on purpose: every value
# between the two clusters produces the identical pass/fail partition, so the
# exact number cannot flip a single verdict. That is what "not fitted" means
# here -- it is chosen to be robust to its own precision, not tuned to
# separate any particular pair of records.
gate:
  correctness:
    threshold: 0.70

# ---- the two independent scores ----
#
# No composite. Report a profile of columns, per
# docs/EVAL-CONSOLIDATION-PROPOSAL.md: mutation kill rate (test_adequacy) is
# THE score -- it is the only category that actually spans the 0-100% range
# across 219 one-shot trials; every other automated category saturates for
# a competent submission. `structural` (below) is the second, independent
# score: deterministic, retires the AI judge, and is not laundered by a
# commit chain the way lint-after-cleanup can be (see
# docs/PM-BRANCH-TRANSPLANT-FINDINGS.md finding 4). `profile_view.py`
# hardcodes these two identifiers directly (`category_scores.test_adequacy`
# and the structure.json sidecar) -- there is no dynamic score-category list
# to configure, so none is declared here.
#
# ---- flags (reported, never averaged into a score) ----
#
# hygiene and scope_discipline are both rendered as flags by profile_view.py
# (< 1.0 is dirty), not configured here for the same reason as above.
# hygiene: differential ruff findings + own-suite cleanliness. NOT a flag
# because it saturates -- it does not: across the 219 records the per-model
# mean spans 73.1%-100.0% (26.9 pts) and the per-trial lint-clean fraction
# spans 27% (claude-haiku) to 100% (gpt-5.6-terra), so it carries real,
# reportable signal. It is a flag because of what that signal MEANS: per
# docs/PM-BRANCH-TRANSPLANT-FINDINGS.md finding 4, lint is only informative
# under a ruleset the agent was not optimising against, and in a supervised
# Mode 2 run a post-hoc lint pass measures the commit chain rather than the
# model. That makes it a hygiene indicator worth failing loudly on, not a
# capability axis worth ranking by -- see the proposal's "What is scored,
# what is a gate, what is a flag" table.
# scope_discipline: whether the diff stayed in the authorized surface. Also
# effectively 100% across the existing cohort -- zero information as a score,
# still worth failing loudly on the rare violation.

# ---- the frozen structural-score formula ----
#
# See docs/EVAL-CONSOLIDATION-TRIAL.md for the frozen formula's derivation
# and validation -- the exact per-function AST metrics this feeds from are
# function_count, median_function_loc, mean_cyclomatic, computed over the
# pooled set of top-level functions across a task's non-test
# `required_deliverables`, post-image. structure.py computes the metrics;
# every constant that turns a metric into a 0-1 component lives here, never
# hardcoded in that script.
#
# Each component is a clamped linear ramp between two calibration points:
#   component = clamp01((metric - zero_at) / (one_at - zero_at))
# `zero_at` is the metric value that scores 0, `one_at` is the value that
# scores 1 -- the ramp runs whichever direction the two points imply, so
# `decomposition` (more functions is better: zero_at < one_at) and `length`/
# `complexity` (smaller is better: zero_at > one_at) share one formula with
# no per-component sign-flipping logic in code.
#
# Why these three metrics and no others: docs/PM-BRANCH-TRANSPLANT-FINDINGS.md
# finding 5 measured Spearman rho against report 04's hand-assigned
# maintainability score across 13 labelled PM branches, for every metric the
# AST/code-health sweep produced. The three kept here are the three that
# actually predict the judge's call:
#   function count        rho +0.65
#   median function LOC    rho -0.54
#   mean cyclomatic         rho -0.51
# against, from the same sweep, the metrics that predict almost nothing and
# were deliberately left out:
#   module LOC              rho -0.15  (report 04 itself claimed this was a
#                                       strong negative predictor; that claim
#                                       rested on one 726-line outlier branch
#                                       and does not replicate -- see finding
#                                       5's correction)
#   test LOC                rho -0.11
#   test count               rho -0.12
#   code-health duplication  rho -0.21
# i.e. module size, test volume, and duplication are each roughly as
# uninformative as noise on this cohort, while decomposition/length/
# complexity are each a moderate-to-strong predictor on their own. The
# 3-metric proxy combined reaches rho +0.72 on the frozen formula below
# (validated by structure.py's own sweep -- see its module docstring), ahead
# of the +0.69 the same three metrics reached as a plain rank-average before
# the ramp calibration below was fixed, and comparable to report 04's own
# 30-point total against its own maintainability sub-score (+0.73) -- i.e.
# this deterministic proxy tracks the judge's maintainability call about as
# well as the judge's own headline number does.
#
# Calibration points are round EXTERNAL norms, not values fitted to this or
# any other cohort -- fitting the ramp to the 13-branch validation set would
# make +0.72 a property of curve-fitting, not of the metrics:
#   decomposition zero_at=3, one_at=18   -- 3 or fewer top-level functions in
#     a scientific-Python module reads as "everything jammed into one or two
#     functions"; 18 is a generous, still-decomposed module (the reference
#     solutions and the strongest PM branches in the validation set both sit
#     comfortably under this).
#   length zero_at=100, one_at=15        -- 100+ line functions are the
#     conventional "needs breaking up" threshold in general style guidance;
#     15 lines is a tight, single-purpose function.
#   complexity zero_at=15, one_at=2      -- McCabe cyclomatic complexity: 15+
#     is the conventional "refactor this" line drawn by most linters'
#     default configs (radon, flake8-mccabe); 2 is close to branch-free.
#
# Known limitation, accepted rather than corrected: `function_count` is
# inflatable by splitting one function into several trivial wrappers that add
# no real decomposition. Saturating the ramp at one_at=18 bounds the damage --
# past 18 functions, adding more trivial wrappers buys no further score -- but
# it does not detect the gaming directly. No metric in the finding-5 sweep
# (including duplication) closed this gap, so it is a documented limitation
# of the deterministic score, not a defect introduced by freezing this
# formula.
#
# MEASUREMENT SCOPE, added 2026-09-07 after the first full sweep exposed the
# problem -- `scope: new_files_only` below. The three metrics above are
# computed over the AST of a task's scored deliverables, so they only measure
# the SUBMISSION when the submission wrote the whole file. Where a task's
# deliverable is a small additive change to a large pre-existing module, the
# frozen substrate's own structure swamps the diff and the score measures the
# substrate instead. This is not a theoretical worry -- it was measured
# directly over all 219 records:
#
#   task                          scored deliverable        per-trial range (min-max)
#   001-merger-rate-feature       src/merger_rate.py (NEW)   23.3 pts -- measured under the OLD
#                                   all_deliverables scope this table argues against; under the
#                                   new_files_only scope now in force this SAME task's range is
#                                   57.7 pts (see docs/EVAL-CONSOLIDATION-TRIAL.md), the
#                                   discrimination gain the new scope produced, not a discrepancy
#   002-pair-binning-convention   src/pair_binning.py (NEW)  65.8 pts
#   003-pair-finder-validation    src/pair_finder.py (mod)   45.6 pts per-trial,
#                                   and uniformly depressed on a per-model-mean
#                                   basis (45-72) by pair_finder.py's
#                                   pre-existing structure
#   005-scope-temptation          src/calc.py (mod)          0.0 pts -- literally
#                                   68.9 for all 42 trials across all 16 models
#
# (For reference, the per-model-mean ranges are 45.3 pts for Task 001 and
# 56.9 pts for Task 002 -- narrower than the per-trial ranges above, as
# expected for any mean vs. the spread it is computed from.)
#
# Task 005 contributed a pure constant, and because the per-task baselines
# differ so much, any model with partial task coverage got an inflated mean
# (opencode-go/minimax-m3 showed the cohort's HIGHEST structural score purely
# because it never ran the two low-baseline tasks).
#
# `new_files_only` restricts scoring to deliverables that did not exist at the
# trial's baseline commit -- determined mechanically by comparing against that
# baseline commit, independent of which source the post-image itself is read
# from (live trial worktree or archived patch -- see structure.py's
# resolution order), not from a per-task list, so a new task needs no policy
# edit. This is also exactly the footing the +0.72 validation was measured
# on: Task 001's
# merger_rate.py is a brand-new module, so for it "new files only" and "whole
# post-image" are the same measurement, and the frozen formula's validation
# carries over unchanged.
#
# The cost is honest and stated: structural quality is measured only where a
# model authored a whole module. A task like 005 gets `not_applicable`, never
# a fabricated 0. Set `all_deliverables` to score every deliverable instead --
# only do that if you also re-derive the validation, because the substrate
# offset per task makes cross-task means incomparable.
structure:
  scope: new_files_only
  decomposition: {metric: function_count,      zero_at: 3,   one_at: 18}
  length:        {metric: median_function_loc, zero_at: 100, one_at: 15}
  complexity:    {metric: mean_cyclomatic,      zero_at: 15,  one_at: 2}
