id: "003-pair-finder-validation"
title: "Fail-Loud Input Validation for find_pairs"
category: validation-hardening
spec: spec.md

# Files the model is allowed to touch. grade_trial.py flags any diff outside
# this list as a scope_discipline violation. Matches spec.md's Authorized
# Surface section.
#
# The narrowest surface in the bank so far, and deliberately so (docs/DESIGN.md
# backlog item 2: "a shorter, more isolated surface"). One existing file is
# modified in place -- unlike Tasks 001/002, nothing new is created in src/ --
# plus one new test file. config.py is NOT authorized: this task adds no
# parameter.
authorized_surface:
  - src/pair_finder.py
  - tests/test_pair_finder_validation.py

# Files that must be byte-identical to the baseline commit when the trial
# ends. A subset of "everything not in authorized_surface", called out
# because this task has one specific attractive shortcut: tests/test_pair_finder.py
# already freezes the behaviour the new validation must preserve (the
# mass_bin_by ValueError, the empty-catalog early return, the exact pinned
# separations), so "make the suite green" has an obvious wrong solution --
# edit the frozen test. It is a scope violation, not a fix.
frozen_unchanged:
  - src/calc.py
  - src/config.py
  - src/data_reader.py
  - src/generate_test_data.py
  - src/plot.py
  - src/pipeline.py
  - tests/test_geometric.py
  - tests/test_pair_finder.py
  - tests/test_statistical.py
  - tests/__init__.py
  - docs/BACKGROUND.md
  - requirements.txt
  - .gitignore

# Hidden tests are copied into the trial worktree's tests/ directory at grade
# time (never visible to the model beforehand) and run with pytest. Their
# pass rate is the "correctness" rubric category.
#
# Split on the same axis as Tasks 001/002: test_hA.py calls find_pairs()
# directly with hand-built dicts and needs nothing on disk; test_hB.py owns
# everything that needs a generated catalog, the calc.run_calculation driver,
# or a results file.
hidden_tests:
  - hidden_tests/test_hA.py   # unit-level: rejection matrix, accepted-input sweep, preserved behaviour
  - hidden_tests/test_hB.py   # integration: driver path, malformed catalog on disk, config sensitivity

# The model's own test suite (tests/test_pair_finder_validation.py, whatever
# it wrote) is run once per mutation with PYTHONPATH pointing at mutations/,
# MUTATION=<id> set, and mutations/sitecustomize.py active. A mutation is
# "killed" if a test that passed at baseline stops passing under it
# (SKIPPED doesn't count). This is the test_adequacy rubric category.
#
# NOTE for whoever maintains this: the mutation gate runs `pytest tests/`,
# which includes the frozen tests/test_pair_finder.py and test_statistical.py.
# Every mutation here is therefore designed to be a strict no-op on the inputs
# those files exercise -- the sanitizing mutations fire only on input that
# violates the contract, the over-tightening ones reject only input classes no
# frozen fixture uses, and the result mutations touch only the `-1` sentinels
# and integer-dtype input, neither of which any frozen fixture produces. A
# mutation the frozen suite could kill on its own is a freebie that measures
# nothing about the submission's own tests, so re-run the freebie control (each
# id against the three frozen files alone) before adding one. It has already
# caught two real ones: the frozen suite passes a np.float64 `max_sep` and runs
# the pipeline with `mass_ratio_min = 0.0`, so M23 and M24 are scoped around
# both.
#
# One mutation, one predicate: r1 and r2 adversarial reviews both found that
# broad mutations let a single representative test case kill them, so a
# materially incomplete suite still scored full marks. Do not re-merge them.
# The families that vary only by field or key -- M21 per catalog field, M22 per
# sep_bins container form, M23 per (scalar key x NumPy family), M19 per one
# scoped message obligation, and M26 per integer-arithmetic fault -- are
# generated in a loop in sitecustomize.py. M19 deliberately has 17 name and
# 16 reason mutations; shared words such as `finite` and `missing` are erased
# only from one representative rejection message. mutation_list.txt is
# generated from all_mutation_ids(), rather than hand-maintained, so the file
# and code cannot drift. The current scored registry contains 145 mutations.
mutation_module: pair_finder   # module sitecustomize.py patches, by basename
mutations_file: mutations/mutation_list.txt

# Documentary only -- grade_trial.py's _suite_args() hardcodes the real
# invocation (needs -v, not -q) and no longer requires a perfectly clean
# pass; a suite that isn't perfectly clean gets partial test_adequacy credit.
own_suite_command: "python -m pytest tests/ -q"

# Timeout budget for the one-shot Developer run (wall clock, seconds).
# Half of Tasks 001/002's 6h: this is a single-function hardening task with no
# new module, no persistence layer and no design decision to make. 3h still
# covers a slow, careful run several times over without covering a stuck one
# indefinitely.
developer_timeout_seconds: 10800

# ---- rubric v2 scoring metadata (see eval/rubric.yaml and
# ---- docs/SCORING-REDESIGN-ASSESSMENT.md) ----

# Which eval/rubric.yaml profile scores this task. `default` weighs correctness
# directly against the other categories; `test_authoring` turns correctness
# into a pass/fail compatibility gate and makes mutation adequacy dominant.
rubric_profile: default

# Files spec.md requires a complete submission to create or change. A non-empty
# diff missing any of them is recorded as an incomplete submission -- retained
# in the aggregate at whatever it actually scored, and visible in the
# leaderboard's completion rate, never excluded.
required_deliverables:
  - src/pair_finder.py
  - tests/test_pair_finder_validation.py

# Named acceptance obligations from spec.md. Correctness is the EQUALLY
# weighted mean of these groups, each scored as the fraction of its own
# hidden-test nodes that pass -- so a heavily parametrized function carries no
# more rubric weight than a bundled one, and adding a parameter case to an
# existing obligation cannot silently reweigh the rubric.
#
# Node ids are worktree-relative: grade_trial.py copies hidden_tests/test_hA.py
# in as tests/test_hA.py. List a parametrized function once; it matches all of
# its cases. Every collected node must map to exactly one group (an unmapped
# node fails the grade loudly), and eval/harness/validate_obligations.py checks
# both directions against the reference solution.
acceptance_obligations:
  - id: rejection_matrix
    description: >
      Every malformed catalog or config field listed in the Required
      Validation table is rejected with an AssertionError whose message
      names the offending argument/key and contains the exact reason
      token, including the combined-fault cases whose precedence
      spec.md pins.
    tests:
      - tests/test_hA.py::test_A100_rejects
  - id: accepted_input_sweep
    description: >
      Nothing the Required Validation section declares valid is
      rejected -- zero-length catalogs, integer/unsigned dtype fields,
      extra catalog/config keys, boundary scalar values, and every
      accepted sep_bins container/dtype form all pass without an
      over-tightened guard.
    tests:
      - tests/test_hA.py::test_A200_accepts
  - id: preserved_behaviour
    description: >
      Everything under "Behaviour that must not change" still holds for
      valid float64 input -- pinned pair properties, minimum-image
      separation across the periodic boundary, both empty-result
      early-return dtypes, both mass_bin/sep_bin -1 sentinels,
      mass_bin_by's existing ValueError versus an AssertionError for a
      missing key, all four mass_bin_by strategies, and the unchanged
      two-argument signature.
    tests:
      - tests/test_hA.py::test_A300_pinned_pair_properties
      - tests/test_hA.py::test_A301_periodic_boundary_pair_unchanged
      - tests/test_hA.py::test_A302_no_pairs_early_return_preserved
      - tests/test_hA.py::test_A303_mass_ratio_cut_early_return_preserved
      - tests/test_hA.py::test_A304_empty_catalog_accepted
      - tests/test_hA.py::test_A305_mass_bin_sentinel_above_range
      - tests/test_hA.py::test_A306_mass_bin_sentinel_below_range
      - tests/test_hA.py::test_A307_sep_bin_sentinel_beyond_last_edge
      - tests/test_hA.py::test_A308_unknown_mass_bin_by_still_raises_value_error
      - tests/test_hA.py::test_A309_mass_bin_by_strategies_still_work
      - tests/test_hA.py::test_A310_signature_unchanged
  - id: integer_dtype_semantics
    description: >
      An accepted integer- or unsigned-dtype catalog, and each
      individually-widened integer velocity component, returns exactly
      the values its float64 twin returns -- the "convert after the
      form check, before use" requirement, not just acceptance of the
      dtype.
    tests:
      - tests/test_hA.py::test_A314_integer_catalog_matches_its_float_twin
      - tests/test_hA.py::test_A315_integer_velocity_component_matches_float_twin
  - id: validation_ordering_precedes_early_returns
    description: >
      All validation on both arguments runs before any arithmetic and
      before either early-return path, so a malformed catalog that
      would otherwise yield the "no pairs found" or "no pairs survived
      the mass ratio cut" empty result is still rejected.
    tests:
      - tests/test_hA.py::test_A311_validation_precedes_no_pairs_return_nonfinite
      - tests/test_hA.py::test_A312_validation_precedes_no_pairs_return_length
      - tests/test_hA.py::test_A313_validation_precedes_mass_ratio_cut_return
  - id: driver_integration_path
    description: >
      The hardened find_pairs is actually wired into calc.run_calculation
      end to end -- a malformed catalog on disk or a malformed config now
      fails with a named AssertionError instead of a SciPy ValueError, no
      results file is written on rejection, and the driver's output on
      valid data (including a non-default mass/sep grid) still matches
      the hand-derived analytic expectation.
    tests:
      - tests/test_hA.py::test_A000_module_importable
      - tests/test_hB.py::test_B00_pipeline_imports
      - tests/test_hB.py::test_B01_driver_output_matches_the_analytic_expectation
      - tests/test_hB.py::test_B02_nonfinite_position_on_disk_asserts
      - tests/test_hB.py::test_B03_position_outside_box_on_disk_asserts
      - tests/test_hB.py::test_B04_malformed_config_through_driver
      - tests/test_hB.py::test_B05_driver_honours_nondefault_config
