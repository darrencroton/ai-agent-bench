id: "004-catalog-loader-test-adequacy"
title: "Test Suite for load_galaxy_catalog"
category: test-adequacy
spec: spec.md

# Files the model is allowed to touch. grade_trial.py flags any diff outside
# this list as a scope_discipline violation. Matches spec.md's Authorized
# Surface section.
#
# The narrowest surface in the bank: exactly one new test file, and nothing
# else. This is docs/DESIGN.md backlog item 3 -- "give a model a correct,
# unguarded function and ask only for tests" -- so the function under test is
# frozen, not authorized. A submission that "fixes" src/data_reader.py has
# misread the task, not found a bug.
authorized_surface:
  - tests/test_data_reader.py

# Files that must be byte-identical to the baseline commit when the trial
# ends. src/data_reader.py heads the list because it is the function under
# test: the single most tempting wrong move here is to edit the thing you were
# asked to test (adding a guard, "clarifying" a message, making it easier to
# test). requirements.txt is listed because a test file that needs a new
# dependency is not a valid submission -- everything this task needs (h5py,
# numpy, pytest) is already there.
#
# This is every file in the frozen-substrate worktree except the one authorized
# path, enumerated from `git ls-tree -r --name-only frozen-substrate` rather
# than from memory -- an r1 review found .gitignore, docs/BACKGROUND.md and
# tests/__init__.py missing from a hand-written list.
frozen_unchanged:
  - src/data_reader.py
  - src/calc.py
  - src/config.py
  - src/generate_test_data.py
  - src/pair_finder.py
  - src/pipeline.py
  - src/plot.py
  - tests/__init__.py
  - tests/test_geometric.py
  - tests/test_pair_finder.py
  - tests/test_statistical.py
  - docs/BACKGROUND.md
  - requirements.txt
  - .gitignore

# Hidden tests are copied into the trial worktree's tests/ directory at grade
# time (never visible to the model beforehand) and run with pytest. Their pass
# rate is the "correctness" rubric category.
#
# READ THIS BEFORE CHANGING THEM. Unlike Tasks 001-003, the submission cannot
# change what the code under test does -- it may only add a test file -- so
# correctness here is a deliberate *floor*, not the measurement: it confirms
# the frozen substrate still behaves as spec.md documents (false only if the
# submission edited a frozen file, shadowed a module, or broke collection) and
# that the one authorized deliverable exists and is collectable. The axis this
# task exists to measure is test_adequacy, below. spec.md says all of this to
# the model in "How this task is scored", and
# reference_solution/README.md records why the alternative (a stdlib-`trace`
# line-coverage floor) was measured and rejected.
#
# Split on the same axis as Tasks 001-003: test_hA.py calls
# load_galaxy_catalog directly against hand-built HDF5 fixtures; test_hB.py
# owns everything that needs the calc.run_calculation driver or the submitted
# file itself.
hidden_tests:
  - hidden_tests/test_hA.py   # unit-level: rejections, selection, dtypes, scalars
  - hidden_tests/test_hB.py   # integration: driver path, deliverable present and collectable

# The model's own test suite (tests/test_data_reader.py, whatever it wrote) is
# run once per mutation with PYTHONPATH pointing at mutations/, MUTATION=<id>
# set, and mutations/sitecustomize.py active. A mutation is "killed" if a
# test that passed at baseline stops passing under it (SKIPPED doesn't
# count). This is the test_adequacy rubric category, and for this task it
# is the whole point.
#
# Freebie note: the mutation gate runs `pytest tests/`, which includes the
# three frozen test files -- but none of them imports data_reader or calc, so
# none of them can kill a mutation of load_galaxy_catalog. That makes every
# kill attributable to the submission's own file. It is measured, not assumed
# (reference_solution/README.md's freebie control): re-run it before adding a
# mutation.
#
# One mutation, one predicate (Task 003's r1/r2 finding). 53 mutations over 22
# named families, M01-M22. Cardinalities: M10 (the float64 conversion), M13
# (which rows survive the selection) and M16 (the order they come back in) are
# per-array families of 7; M14 (one required rejection-message substring each)
# is a family of 9; M19 (one per adjacent guard pair whose order is
# observable) is a family of 3; M20 (the float() cast on each returned
# scalar), M21 (an extra dataset / an extra attribute leaked into the result)
# and M22 (an over-strict guard on each accepted scalar) are families of 2; the
# remaining 14 (M01-M09, M11, M12, M15, M17, M18) are single mutations. All are
# generated from the registries in sitecustomize.py, and mutation_list.txt is
# regenerated from those registries rather than hand-maintained, so the file
# and the code cannot drift.
#
# Four rules that the r1 and r2 reviews of this task added, all load-bearing:
#   * no mutation may be killable by a shape-only check -- M13 preserves the
#     post-selection length and corrupts only which rows survived, measured by
#     reference_solution/degenerate_controls/shape_only/;
#   * no mutation may be killable by a side channel unrelated to its predicate
#     -- M16 copies its reversed array so memory layout never differs, and M14
#     raises outside the exception handler so __context__/__suppress_context__
#     match the frozen function's bare assert;
#   * a family that varies by field or by message obligation gets one mutation
#     per member, never one bundled mutation (M10, M13, M14, M16, M20);
#   * the hook patches `builtins.__import__`, `importlib.import_module` AND
#     `importlib.reload`, because the latter two do not route through the first
#     and a submission using either would otherwise receive no mutation at all.
mutation_module: data_reader   # module sitecustomize.py patches, by basename
mutations_file: mutations/mutation_list.txt

# Documentary only -- grade_trial.py's _suite_args() hardcodes the real
# invocation (needs -v, not -q) and no longer requires a perfectly clean
# pass; a suite that isn't perfectly clean gets partial test_adequacy credit.
own_suite_command: "python -m pytest tests/ -q"

# Timeout budget for the one-shot Developer run (wall clock, seconds).
# Two thirds of Task 003's 3h: one 73-line function, no implementation to
# write, no design decision to make, and no frozen behaviour to preserve --
# only a test file. 2h still covers a slow, careful run several times over.
developer_timeout_seconds: 7200

# ---- rubric v2 scoring metadata (see eval/rubric.yaml and
# ---- docs/SCORING-REDESIGN-ASSESSMENT.md) ----

# Which eval/rubric.yaml profile scores this task. `default` weighs correctness
# directly against the other categories; `test_authoring` turns correctness
# into a pass/fail compatibility gate and makes mutation adequacy dominant.
rubric_profile: test_authoring

# Files spec.md requires a complete submission to create or change. A non-empty
# diff missing any of them is recorded as an incomplete submission -- retained
# in the aggregate at whatever it actually scored, and visible in the
# leaderboard's completion rate, never excluded.
required_deliverables:
  - tests/test_data_reader.py

# Named acceptance obligations from spec.md. Correctness is the EQUALLY
# weighted mean of these groups, each scored as the fraction of its own
# hidden-test nodes that pass -- so a heavily parametrized function carries no
# more rubric weight than a bundled one, and adding a parameter case to an
# existing obligation cannot silently reweigh the rubric.
#
# Node ids are worktree-relative: grade_trial.py copies hidden_tests/test_hA.py
# in as tests/test_hA.py. List a parametrized function once; it matches all of
# its cases. Every collected node must map to exactly one group (an unmapped
# node fails the grade loudly), and eval/harness/validate_obligations.py checks
# both directions against the reference solution.
acceptance_obligations:
  - id: frozen_rejection_semantics
    description: >
      The five documented rejection conditions still raise AssertionError with
      their distinguishing message substrings, in the documented evaluation
      order.
    tests:
      - tests/test_hA.py::test_A01_missing_file_rejected
      - tests/test_hA.py::test_A02_missing_file_message_names_path
      - tests/test_hA.py::test_A03_empty_catalog_rejected
      - tests/test_hA.py::test_A04_non_positive_box_size_rejected
      - tests/test_hA.py::test_A05_negative_mass_rejected
      - tests/test_hA.py::test_A06_empty_selection_rejected
      - tests/test_hA.py::test_A07_emptiness_reported_before_box_size
  - id: accepted_input_and_return_shape
    description: >
      Legal inputs that must not raise, namely zero stellar mass and extra
      datasets or attributes in the file, are still accepted and ignored, and
      the returned dict still has exactly the nine documented keys.
    tests:
      - tests/test_hA.py::test_A08_zero_mass_accepted
      - tests/test_hA.py::test_A09_extra_datasets_and_attrs_ignored
      - tests/test_hA.py::test_A10_returned_keys_exact
  - id: mass_selection_semantics
    description: >
      The mass selection is still applied identically and order-preservingly
      to every one of the seven arrays, both range edges are still inclusive,
      and the range is still read from config rather than assumed.
    tests:
      - tests/test_hA.py::test_A11_selection_applied_to_every_array
      - tests/test_hA.py::test_A12_selection_preserves_order
      - tests/test_hA.py::test_A13_selection_edges
      - tests/test_hA.py::test_A14_selection_reads_the_config
  - id: dtype_and_scalar_semantics
    description: >
      Every returned array is still converted to float64 with its values
      preserved, and the two file-level scalar attributes are still returned
      as unscaled Python floats unaffected by the mass selection.
    tests:
      - tests/test_hA.py::test_A15_arrays_converted_to_float64
      - tests/test_hA.py::test_A16_integer_values_survive_conversion
      - tests/test_hA.py::test_A17_redshift_returned
      - tests/test_hA.py::test_A18_box_size_returned
      - tests/test_hA.py::test_A19_scalars_returned_unscaled
      - tests/test_hA.py::test_A20_scalars_unaffected_by_selection
  - id: driver_integration_path
    description: >
      The frozen calc.run_calculation driver still loads a catalog through
      load_galaxy_catalog end to end and writes correct pair-finding results,
      and still surfaces the loader's rejections for an out-of-range catalog
      and for a non-positive box_size.
    tests:
      - tests/test_hB.py::test_B01_driver_loads_a_catalog_and_writes_results
      - tests/test_hB.py::test_B02_driver_rejects_an_out_of_range_catalog
      - tests/test_hB.py::test_B03_driver_rejects_a_bad_box_size
  - id: deliverable_exists_and_collects
    description: >
      The task's one authorized deliverable, tests/test_data_reader.py, exists
      in the submitted worktree and pytest can collect at least one test from
      it.
    tests:
      - tests/test_hB.py::test_B04_deliverable_exists
      - tests/test_hB.py::test_B05_deliverable_collects_at_least_one_test
